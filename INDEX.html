<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Health Dashboard | 7-Day Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-main: #f4f7f9;
      --bg-card: #ffffff;
      --text-primary: #132238;
      --text-secondary: #5c6f84;
      --accent-teal: #0d9488;
      --accent-teal-soft: #ccfbf1;
      --accent-blue: #0284c7;
      --accent-blue-soft: #e0f2fe;
      --accent-indigo: #4f46e5;
      --accent-indigo-soft: #e0e7ff;
      --accent-amber: #d97706;
      --accent-amber-soft: #fef3c7;
      --accent-rose: #e11d48;
      --accent-rose-soft: #ffe4e6;
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-md: 0 6px 20px rgba(15, 23, 42, 0.06);
      --radius-lg: 16px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.6;
      padding: 24px 16px 48px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      background: var(--bg-card);
      padding: 20px 24px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-subtitle {
      font-size: 0.92rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .profile-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: #f1f5f9;
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .btn-edit {
      background: var(--accent-teal);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-edit:hover {
      background: #0f766e;
    }

    .btn-edit:active {
      transform: scale(0.98);
    }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .kpi-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .kpi-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

      width: 38
